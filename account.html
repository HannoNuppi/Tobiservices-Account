<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TobiServices – Mein Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body class="jd-page">
<div class="jd-wrap" style="max-width:720px">
  <div class="jd-topbar">
    <div class="jd-logo">
      <span class="jd-logo-tag">TobiServices</span>
      <div class="jd-logo-main"><span>MEIN</span><span class="l2">ACCOUNT</span></div>
    </div>
  </div>
  <div id="app" style="margin-top:24px"></div>
</div>
<script src="theme.js"></script>
<script type="module">
import { onUser, signOut, isAdmin, CONFIG } from "./auth-core.js";
const app=document.getElementById("app");

onUser((user,profile)=>{
  if(!user){
    location.replace("./login.html?return="+encodeURIComponent(location.href));
    return;
  }

  if(!profile){
    app.innerHTML="<div class=\"jd-card\"><h3>Account nicht gefunden</h3><p>Deine Sitzung ist gültig, aber das TobiServices-Profil fehlt. Bitte melde dich erneut an.</p><button class=\"jd-btn\" id=\"logout\" style=\"margin-top:12px\">Abmelden</button></div>";
    document.getElementById("logout").onclick=async()=>{ await signOut(); location.href=CONFIG.loginUrl; };
    return;
  }

  const tags=Array.isArray(profile.tags)?profile.tags:[];
  const accountEmail=profile.email||user.email||"";
  app.innerHTML=
    "<div class=\"jd-card\">"
    +"<h3 id=\"name\"></h3>"
    +"<p>TobiServices Account</p>"
    +(profile.disabled===true?"<div style=\"margin:12px 0;padding:12px;border:1px solid rgba(255,62,120,.65);border-radius:12px;background:rgba(255,62,120,.09);color:var(--text);font-size:13px;line-height:1.5\"><strong>Account auf Dienstebene gesperrt</strong><br>Dein Konto bleibt erhalten. Verbundene TobiServices-Dienste sollen diesen Sperrstatus beachten. Im Spark-Tarif kann die Anmeldung selbst nicht automatisch deaktiviert werden.</div>":"")
    +"<div class=\"wallet-balance\"><div class=\"wallet-coin-icon\" aria-hidden=\"true\">✦</div><div class=\"wallet-copy\"><span>GOLDMÜNZEN</span><strong id=\"goldCoins\">0</strong><small>Gemeinsames Guthaben über alle TobiServices-Dienste</small></div></div>"
    +"<div style=\"margin-top:16px\"><div style=\"font-size:12px;color:var(--muted);margin-bottom:7px\">Tags</div><div id=\"tags\" style=\"display:flex;gap:8px;flex-wrap:wrap\"></div></div>"
    +"<div style=\"margin-top:16px;font-size:11px;color:var(--muted)\">E-Mail-Adresse<div id=\"email\" class=\"mono\" style=\"margin-top:5px;word-break:break-all\"></div></div>"
    +"<div style=\"margin-top:12px;font-size:11px;color:var(--muted)\">Account-ID<div id=\"uid\" class=\"mono\" style=\"margin-top:5px;word-break:break-all\"></div></div>"
    +"<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:18px\">"
    +(isAdmin(profile)?"<button class=\"jd-btn\" id=\"admin\">Admin Center</button>":"")
    +"<button class=\"jd-btn-ghost\" id=\"logout\">Abmelden</button></div></div>";

  document.getElementById("name").textContent=user.displayName||profile.displayName||user.email||"TobiServices";
  document.getElementById("email").textContent=accountEmail||"(nicht verfügbar)";
  document.getElementById("uid").textContent=user.uid;
  const goldCoins=Number.isSafeInteger(profile.goldCoins)?profile.goldCoins:0;
  document.getElementById("goldCoins").textContent=goldCoins.toLocaleString("de-DE");

  const tagBox=document.getElementById("tags");
  if(tags.length){
    tags.forEach(tag=>{ const pill=document.createElement("span"); pill.className="jd-pill"; pill.textContent=tag; tagBox.appendChild(pill); });
  }else{
    const empty=document.createElement("span"); empty.style.color="var(--muted)"; empty.style.fontSize="13px"; empty.textContent="Keine Tags"; tagBox.appendChild(empty);
  }

  document.getElementById("logout").onclick=async()=>{ await signOut(); location.href=CONFIG.loginUrl; };
  document.getElementById("admin")?.addEventListener("click",()=>{ location.href="./admin.html"; });
});
</script>
</body>
</html>
