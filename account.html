<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TobiServices – Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body class="jd-page">
<div class="jd-wrap" style="max-width:720px">
  <div class="jd-topbar">
    <div class="jd-logo"><span class="jd-logo-tag">TobiServices</span>
      <div class="jd-logo-main"><span>MEIN</span><span class="l2">ACCOUNT</span></div>
    </div>
  </div>
  <div id="app" style="margin-top:24px"></div>
</div>

<script src="theme.js"></script>
<script type="module">
import { onUser, signOut, isAdmin, getProfile, auth } from "./auth-core.js";

const app = document.getElementById("app");

onUser(async (user, profile) => {
  if (!user) {
    location.replace("./login.html?return=" + encodeURIComponent(location.href));
    return;
  }

  if (!user.emailVerified) {
    app.innerHTML = '<div class="jd-banner"><b>E-Mail noch nicht bestätigt.</b> Bitte bestätige deine Adresse über die E-Mail von TobiServices.</div>';
    return;
  }

  const tags = Array.isArray(profile?.tags) ? profile.tags : [];

  app.innerHTML = `
    <div class="jd-card">
      <h3 id="name"></h3>
      <p id="email"></p>

      <div style="margin-top:18px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:7px">Tags</div>
        <div id="tags" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px">
        ${isAdmin(profile) ? '<button class="jd-btn" id="admin">Admin-Panel</button>' : ""}
        <button class="jd-btn-ghost" id="logout">Abmelden</button>
      </div>
    </div>

    <div class="jd-card" style="margin-top:14px">
      <h3>Sicherheit</h3>
      <p>Passwortänderung und Kontowiederherstellung laufen über Firebase Authentication.</p>
      <button class="jd-btn-ghost" id="reset" style="margin-top:14px">Passwort-Reset-Mail senden</button>
    </div>
  `;

  document.getElementById("name").textContent = user.displayName || "TobiServices Account";
  document.getElementById("email").textContent = user.email || "";

  const tagBox = document.getElementById("tags");
  if (tags.length) {
    tags.forEach(tag => {
      const pill = document.createElement("span");
      pill.className = "jd-pill";
      pill.textContent = tag;
      tagBox.appendChild(pill);
    });
  } else {
    const text = document.createElement("span");
    text.style.color = "var(--muted)";
    text.style.fontSize = "13px";
    text.textContent = "Keine Tags";
    tagBox.appendChild(text);
  }

  document.getElementById("logout").onclick = signOut;
  document.getElementById("admin")?.addEventListener("click", () => {
    location.href = "./admin.html";
  });

  document.getElementById("reset").onclick = async () => {
    try {
      await auth.currentUser?.getIdToken(true);
      const { resetPassword } = await import("./auth-core.js");
      await resetPassword(user.email);
    } catch {}
    jdToast("Falls dein Konto existiert, wurde eine Reset-Mail angefordert.");
  };
});
</script>
</body>
</html>
