<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TobiServices – Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body class="jd-page">
<div class="jd-wrap" style="max-width:460px">
  <div class="jd-topbar">
    <div class="jd-logo"><span class="jd-logo-tag">TobiServices</span>
      <div class="jd-logo-main"><span>ACCOUNT</span><span class="l2">CENTER</span></div>
    </div>
  </div>

  <div class="jd-card" style="margin-top:24px" id="card"></div>
</div>

<script src="theme.js"></script>
<script type="module">
import {
  auth,
  onUser,
  ensureAccount,
  signOut,
  safeReturnUrl,
  CONFIG
} from "./auth-core.js";

const $=s=>document.querySelector(s);
const ret=safeReturnUrl(new URLSearchParams(location.search).get("return")||"");
let busy=false;

function goAfterLogin(){
  location.replace(ret||CONFIG.accountUrl);
}

function renderStart(){
  $("#card").innerHTML=`
    <h3>TobiServices Account</h3>
    <p>Kein Passwort und keine E-Mail nötig. Dein Account wird sicher mit Firebase verknüpft.</p>
    <form id="startForm" style="display:grid;gap:10px;margin-top:14px">
      <input class="jd-input" id="name" maxlength="40" minlength="1"
        placeholder="Anzeigename" autocomplete="nickname" required>
      <small style="color:var(--muted)">
        Der Anzeigename ist öffentlich innerhalb der TobiServices-Dienste.
      </small>
      <button class="jd-btn" id="startBtn">Account starten</button>
    </form>
    <p style="font-size:11px;color:var(--muted);margin-top:14px">
      Dieser Firebase-Account ist anonym und wird an diesen Browser gebunden.
    </p>`;

  $("#startForm").onsubmit=async e=>{
    e.preventDefault();
    if(busy) return;

    const name=$("#name").value.trim();
    if(name.length<1||name.length>40){
      return jdToast("Der Anzeigename muss 1–40 Zeichen lang sein.");
    }

    busy=true;
    $("#startBtn").disabled=true;
    try{
      await ensureAccount(name);
      goAfterLogin();
    }catch(error){
      console.error(error);
      jdToast(error.code==="operation-not-allowed"
        ? "Anonyme Anmeldung ist in Firebase noch nicht aktiviert."
        : "Account konnte nicht erstellt werden.");
      busy=false;
      $("#startBtn").disabled=false;
    }
  };
}

onUser((user,profile)=>{
  if(!user){
    renderStart();
    return;
  }

  if(busy) return;

  if(!profile){
    $("#card").innerHTML=`
      <h3>Account einrichten</h3>
      <p>Wähle deinen Anzeigenamen.</p>
      <input class="jd-input" id="name" maxlength="40" placeholder="Anzeigename"
        style="margin-top:12px">
      <button class="jd-btn" id="continue" style="margin-top:10px">Weiter</button>`;
    $("#continue").onclick=async()=>{
      try{
        await ensureAccount($("#name").value.trim());
        location.reload();
      }catch(e){
        jdToast("Account konnte nicht eingerichtet werden.");
      }
    };
    return;
  }

  $("#card").innerHTML=`
    <h3 id="welcome"></h3>
    <p>Du bist bereits angemeldet.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="jd-btn" id="account">Accountseite</button>
      <button class="jd-btn-ghost" id="logout">Account wechseln</button>
    </div>`;

  $("#welcome").textContent=user.displayName||profile.displayName||"TobiServices Account";
  $("#account").onclick=()=>location.href=CONFIG.accountUrl;
  $("#logout").onclick=async()=>{
    await signOut();
    location.reload();
  };

  if(ret) goAfterLogin();
});
</script>
</body>
</html>
