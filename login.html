<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TobiServices – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body class="jd-page">
<div class="jd-wrap" style="max-width:460px">
  <div class="jd-topbar">
    <div class="jd-logo">
      <span class="jd-logo-tag">TobiServices</span>
      <div class="jd-logo-main"><span>ACCOUNT</span><span class="l2">CENTER</span></div>
    </div>
  </div>

  <div class="jd-card" style="margin-top:24px" id="card"></div>
</div>

<script src="theme.js"></script>
<script type="module">
import {
  auth,
  login,
  onUser,
  signOut,
  safeReturnUrl,
  CONFIG
} from "./auth-core.js";

const $=s=>document.querySelector(s);
const ret=safeReturnUrl(new URLSearchParams(location.search).get("return")||"");
let busy=false;

function showError(error){
  console.error(error);
  const code=error?.code||"";
  if(code.includes("unauthenticated")){
    return jdToast("E-Mail-Adresse oder Passwort ist falsch.");
  }
  if(code.includes("unavailable") || code.includes("failed-precondition")){
    return jdToast("TobiServices-Server ist noch nicht bereit oder nicht erreichbar.");
  }
  jdToast("Anmeldung fehlgeschlagen.");
}

function renderLogin(){
  $("#card").innerHTML=`
    <h3>TobiServices Account</h3>
    <p>Melde dich mit einem bestehenden Firebase-Authentication-Konto und deiner E-Mail-Adresse an.</p>

    <form id="loginForm" style="display:grid;gap:10px;margin-top:14px">
      <input class="jd-input" id="username" type="email" maxlength="254"
        placeholder="E-Mail-Adresse" autocomplete="email" required>
      <input class="jd-input" id="password" maxlength="128"
        type="password" placeholder="Passwort" autocomplete="current-password" required>
      <button class="jd-btn" id="loginBtn">Anmelden</button>
    </form>

    <p style="font-size:11px;color:var(--muted);margin-top:14px">
      Accounts werden direkt in Firebase Authentication verwaltet. Dein Admin-Status kommt aus dem serverseitig geprüften Tag-Profil.
    </p>`;

  $("#loginForm").onsubmit=async event=>{
    event.preventDefault();
    if(busy) return;

    busy=true;
    $("#loginBtn").disabled=true;

    try{
      await login($("#username").value.trim(), $("#password").value);
      location.replace(ret||CONFIG.accountUrl);
    }catch(error){
      showError(error);
      $("#loginBtn").disabled=false;
      busy=false;
    }
  };
}

onUser((user,profile)=>{
  if(!user){
    renderLogin();
    return;
  }

  if(busy) return;

  $("#card").innerHTML=`
    <h3>Bereits angemeldet</h3>
    <p id="welcome"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      <button class="jd-btn" id="account">Accountseite</button>
      <button class="jd-btn-ghost" id="logout">Abmelden</button>
    </div>`;

  $("#welcome").textContent=(profile?.displayName||user.displayName||"TobiServices Account")+" ist bereits angemeldet.";
  $("#account").onclick=()=>location.href=CONFIG.accountUrl;
  $("#logout").onclick=async()=>{
    await signOut();
    renderLogin();
  };
});
</script>
</body>
</html>
