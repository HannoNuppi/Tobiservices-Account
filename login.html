<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  form{display:grid; gap:10px; position:relative; z-index:1; margin-top:12px;}
  .sw{background:none; border:none; color:var(--cyan); cursor:pointer; font:inherit; font-size:13px; padding:0;}
  .links{display:flex; justify-content:space-between; position:relative; z-index:1; margin-top:12px;}
</style>
</head>
<body class="jd-page">
<div class="jd-wrap" style="max-width:420px">
  <div class="jd-topbar">
    <div class="jd-logo"><span class="jd-logo-tag">Netzwerk</span>
      <div class="jd-logo-main"><span>MEIN</span><span class="l2">KONTO</span></div></div>
  </div>
  <div class="jd-card" style="margin-top:24px" id="card"></div>
</div>
<script src="theme.js"></script>
<script type="module">
import { signIn, signUp, signOut, resetPassword, onUser, CONFIG } from "./auth-core.js";
const $ = (s) => document.querySelector(s);
const ret = new URLSearchParams(location.search).get("return");
const back = () => { try { const u = new URL(ret);
  if (u.protocol === "https:" && CONFIG.allowedReturnHosts.includes(u.hostname)) location.href = u.href; } catch {} };
const errs = {
  "auth/invalid-credential": "E-Mail oder Passwort stimmt nicht.",
  "auth/email-already-in-use": "Diese E-Mail ist bereits registriert.",
  "auth/weak-password": "Das Passwort braucht mindestens 6 Zeichen.",
  "auth/invalid-email": "Bitte eine gültige E-Mail eingeben.",
  "auth/too-many-requests": "Zu viele Versuche. Bitte warte kurz.",
};
let reg = false, busy = false;

function form() {
  $("#card").innerHTML = `
    <h3>${reg ? "Konto erstellen" : "Anmelden"}</h3>
    <p>${reg ? "Ein Konto für alle Seiten im Netzwerk." : "Willkommen zurück."}</p>
    <form id="f">
      ${reg ? '<input class="jd-input" id="n" placeholder="Anzeigename" maxlength="40" required autocomplete="nickname">' : ""}
      <input class="jd-input" id="e" type="email" placeholder="E-Mail" required autocomplete="email">
      <input class="jd-input" id="p" type="password" placeholder="Passwort" minlength="6" required autocomplete="${reg ? "new-password" : "current-password"}">
      <button class="jd-btn" id="go">${reg ? "Konto erstellen" : "Anmelden"}</button>
    </form>
    <div class="links">
      <button class="sw" id="sw">${reg ? "Ich habe schon ein Konto" : "Neu hier? Konto erstellen"}</button>
      ${reg ? "" : '<button class="sw" id="rs">Passwort vergessen?</button>'}
    </div>`;
  $("#sw").onclick = () => { reg = !reg; form(); };
  if ($("#rs")) $("#rs").onclick = async () => {
    const e = $("#e").value; if (!e) return jdToast("Gib zuerst deine E-Mail ein.");
    try { await resetPassword(e); } catch {}
    jdToast("Falls das Konto existiert, ist eine E-Mail unterwegs.");
  };
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault(); $("#go").disabled = true; busy = true;
    try {
      reg ? await signUp($("#n").value.trim(), $("#e").value, $("#p").value) : await signIn($("#e").value, $("#p").value);
      busy = false; ret ? back() : location.reload();
    } catch (e) { busy = false; jdToast(errs[e.code] || "Das hat nicht geklappt: " + e.code); $("#go").disabled = false; }
  };
}

onUser((u, p) => {
  if (!u) return form();
  if (busy) return;
  if (ret) return back();
  $("#card").innerHTML = `<h3></h3><p>Angemeldet · ${p ? p.mojo : 0} Mojo</p>
    <div class="links"><button class="jd-btn-ghost" id="lo">Abmelden</button></div>`;
  $("#card h3").textContent = u.displayName || u.email;
  $("#lo").onclick = () => signOut();
});
</script>
</body>
</html>
